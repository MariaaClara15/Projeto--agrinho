<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Tech Cyber Forest</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    height:100vh;
    background:#02110a;
}

/* FUNDO */
.forest{
    position:fixed;
    width:100%;
    height:100%;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)),
        url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1920');
    background-size:cover;
    background-position:center;
    animation:zoomForest 25s infinite alternate ease-in-out;
}

/* CAMADA NEON */
.glow{
    position:absolute;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,128,0.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0,255,180,0.12), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(0,255,90,0.08), transparent 40%);
    mix-blend-mode:screen;
    animation:pulse 6s infinite alternate;
}

/* PARTÍCULAS */
.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particles span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    background:#00ff99;
    border-radius:50%;
    box-shadow:0 0 10px #00ff99;
    animation:float linear infinite;
}

/* LOGIN */
.login-box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:340px;
    padding:35px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(14px);

    border-radius:20px;

    box-shadow:
        0 0 30px rgba(0,255,128,0.25),
        inset 0 0 10px rgba(255,255,255,0.05);

    color:white;
    z-index:10;
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
    color:#00ff99;
    text-shadow:0 0 15px #00ff99;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;

    border:none;
    border-radius:10px;

    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;

    border:none;
    border-radius:10px;

    background:#00ff99;
    color:#02110a;

    font-weight:bold;
    cursor:pointer;

    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ff99;
}

/* ANIMAÇÕES */

@keyframes float{
    from{
        transform:translateY(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

@keyframes zoomForest{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }
}

@keyframes pulse{
    from{
        opacity:0.5;
    }

    to{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="forest"></div>
<div class="glow"></div>

<div class="particles" id="particles"></div>

<div class="login-box">
    <h1>Eco Tech</h1>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">

    <button>Entrar</button>
</div>

<script>
const particles = document.getElementById("particles");

for(let i = 0; i < 120; i++){

    const span = document.createElement("span");

    span.style.left = Math.random() * 100 + "vw";

    span.style.animationDuration =
        (Math.random() * 10 + 5) + "s";

    span.style.opacity = Math.random();

    span.style.width =
        span.style.height =
        (Math.random() * 4 + 2) + "px";

    particles.appendChild(span);
}
</script>

</body>
</html>
