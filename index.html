<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTech Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(
        135deg,
        #081C15,
        #1B4332,
        #0F172A
      );
      overflow:hidden;
    }

    /* Fundo animado */
    body::before{
      content:"";
      position:absolute;
      width:200%;
      height:200%;
      background:
      radial-gradient(#39FF88 1px, transparent 1px);
      background-size:40px 40px;
      animation:moveBg 20s linear infinite;
      opacity:0.15;
    }

    @keyframes moveBg{
      from{
        transform:translateY(0);
      }
      to{
        transform:translateY(-50px);
      }
    }

    .login-box{
      position:relative;
      width:350px;
      padding:40px;
      border-radius:20px;

      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,0.1);

      box-shadow:
      0 0 30px rgba(57,255,136,0.2);

      color:white;
      z-index:1;
    }

    .login-box h1{
      text-align:center;
      margin-bottom:30px;
      color:#39FF88;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:12px;

      background:rgba(255,255,255,0.1);
      color:white;
      font-size:16px;
    }

    .input-group input::placeholder{
      color:#ccc;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;

      background:
      linear-gradient(
        90deg,
        #39FF88,
        #2E7D32
      );

      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);

      box-shadow:
      0 0 20px #39FF88;
    }

    .error{
      margin-top:15px;
      color:#ff6b6b;
      text-align:center;
    }

    .success{
      margin-top:15px;
      color:#39FF88;
      text-align:center;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>EcoTech</h1>

    <div class="input-group">
      <input
        type="email"
        id="email"
        placeholder="Digite seu email"
      />
    </div>

    <div class="input-group">
      <input
        type="password"
        id="password"
        placeholder="Digite sua senha"
      />
    </div>

    <button onclick="login()">
      Entrar
    </button>

    <p id="message"></p>
  </div>

  <script>
    function login(){

      const email =
      document.getElementById("email").value;

      const password =
      document.getElementById("password").value;

      const message =
      document.getElementById("message");

      // LOGIN EXEMPLO
      const correctEmail =
      "admin@ecotech.com";

      const correctPassword =
      "123456";

      if(
        email === correctEmail &&
        password === correctPassword
      ){

        message.className = "success";

        message.innerText =
        "Login realizado com sucesso!";

        // REDIRECIONAR
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1500);

      } else {

        message.className = "error";

        message.innerText =
        "Email ou senha incorretos.";

      }
    }
  </script>

</body>
</html>
