<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EcoTech</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#000;
      color:white;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-1;
    }

    .overlay{
      position:absolute;
      width:100%;
      height:100vh;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.6)
      );

      text-align:center;
      padding:20px;
    }

    h1{
      font-size:80px;
      color:#39FF88;

      text-shadow:
      0 0 20px #39FF88;
    }

    p{
      margin-top:20px;
      font-size:28px;
      max-width:800px;
      line-height:1.5;
      color:#ddd;
    }

    button{
      margin-top:40px;

      padding:16px 40px;

      border:none;
      border-radius:14px;

      background:
      linear-gradient(
        90deg,
        #39FF88,
        #2E7D32
      );

      color:white;
      font-size:18px;
      font-weight:bold;

      cursor:pointer;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);

      box-shadow:
      0 0 25px #39FF88;
    }

    @media(max-width:768px){

      h1{
        font-size:50px;
      }

      p{
        font-size:22px;
      }

    }

  </style>
</head>

<body>

  <!-- TEXTO -->

  <div class="overlay">

    <h1>EcoTech</h1>

    <p>
      Agro forte, futuro sustentável.
      Equilíbrio entre produção e meio ambiente.
    </p>

    <button>
      Explorar Tecnologia
    </button>

  </div>

  <!-- PLANETA 3D -->

  <script>

    // CENA

    const scene = new THREE.Scene();

    const camera =
    new THREE.PerspectiveCamera(
      75,
      window.innerWidth/window.innerHeight,
      0.1,
      1000
    );

    const renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document.body.appendChild(
      renderer.domElement
    );

    // TEXTURA TERRA

    const textureLoader =
    new THREE.TextureLoader();

    const earthTexture =
    textureLoader.load(
      "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );

    // GEOMETRIA

    const geometry =
    new THREE.SphereGeometry(
      2,
      64,
      64
    );

    const material =
    new THREE.MeshStandardMaterial({
      map:earthTexture
    });

    const earth =
    new THREE.Mesh(
      geometry,
      material
    );

    scene.add(earth);

    // LUZ

    const light =
    new THREE.PointLight(
      0xffffff,
      2
    );

    light.position.set(5,3,5);

    scene.add(light);

    const ambient =
    new THREE.AmbientLight(
      0xffffff,
      0.4
    );

    scene.add(ambient);

    // POSIÇÃO CAMERA

    camera.position.z = 5;

    // ESTRELAS

    const starsGeometry =
    new THREE.BufferGeometry();

    const starsCount = 10000;

    const positions = [];

    for(let i=0;i<starsCount;i++){

      positions.push(
        (Math.random()-0.5)*200
      );

      positions.push(
        (Math.random()-0.5)*200
      );

      positions.push(
        (Math.random()-0.5)*200
      );

    }

    starsGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(
        positions,
        3
      )
    );

    const starsMaterial =
    new THREE.PointsMaterial({
      color:0xffffff,
      size:0.1
    });

    const stars =
    new THREE.Points(
      starsGeometry,
      starsMaterial
    );

    scene.add(stars);

    // ANIMAÇÃO

    function animate(){

      requestAnimationFrame(animate);

      earth.rotation.y += 0.002;

      stars.rotation.y += 0.0002;

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // RESPONSIVO

    window.addEventListener(
      "resize",
      ()=>{

        camera.aspect =
        window.innerWidth/window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
